<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SpaceFlow — Tests</title>
<style>
  body { background:#0a0a1a; color:#ccc; font-family:'Courier New',monospace; padding:24px; }
  h1   { color:#00ddff; margin-bottom:16px; }
  h2   { color:#888; font-size:13px; margin:18px 0 6px; text-transform:uppercase; letter-spacing:2px; border-bottom:1px solid #333; padding-bottom:4px; }
  .pass { color:#44ff44; }
  .fail { color:#ff4444; }
  #summary { margin-top:20px; font-size:16px; font-weight:bold; padding:10px; border:2px solid #333; }
  #summary.all-pass { border-color:#44ff44; color:#44ff44; }
  #summary.has-fail  { border-color:#ff4444; color:#ff4444; }
  pre { background:#111; padding:6px 10px; font-size:11px; color:#f88; margin-top:2px; }
</style>
</head>
<body>
<h1>⚡ SpaceFlow — Test Suite</h1>
<div id="output"></div>
<div id="summary"></div>

<!-- Same DOM structure as index.html so sidebar.js and game.js can run -->
<canvas id="game" width="600" height="500" style="display:none"></canvas>
<div id="wrapper" style="display:none">
  <div id="sidebar">
    <div id="setupArea">
      <input type="text" id="nameInput" placeholder="Enter name..." maxlength="12" autocomplete="off">
      <button id="addPlayerBtn">+ Add Player</button>
      <div id="playerList"></div>
      <button id="startGameBtn" disabled>▶ START GAME</button>
      <button id="resetPlayersBtn">✕ Reset All Players & Scores</button>
    </div>
    <div id="gameArea" style="display:none">
      <div id="currentTurnInfo">
        <div class="turn-name" id="turnName"></div>
        <div class="turn-mode" id="turnMode"></div>
      </div>
      <div id="scoreboard"></div>
      <button id="nextTurnBtn">⏭ Skip Game</button>
      <button id="resetBtn">↺ New Game</button>
    </div>
  </div>
</div>

<!-- Game source (same order as index.html) -->
<script src="js/lib/phaser.min.js"></script>
<script src="js/scenes/shared.js"></script>
<script src="js/audio.js"></script>
<script src="js/storage.js"></script>
<script src="js/scenes/BootScene.js"></script>
<script src="js/scenes/MenuScene.js"></script>
<script src="js/scenes/TurnAnnounceScene.js"></script>
<script src="js/scenes/SamyScene.js"></script>
<script src="js/scenes/FloScene.js"></script>
<script src="js/scenes/JanScene.js"></script>
<script src="js/scenes/FelixScene.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/game.js"></script>

<script>
// ─── Minimal test framework ───────────────────────────────────────────
const results = [];
let currentSection = '';

function section(name) {
  currentSection = name;
}

function test(name, fn) {
  try {
    fn();
    results.push({ ok: true, section: currentSection, name });
  } catch (e) {
    results.push({ ok: false, section: currentSection, name, error: e.message });
  }
}

function assert(condition, msg) {
  if (!condition) throw new Error(msg || 'Assertion failed');
}

function assertEqual(a, b, msg) {
  if (a !== b) throw new Error(msg || `Expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
}

function assertApprox(a, b, tol, msg) {
  tol = tol ?? 0.0001;
  if (Math.abs(a - b) > tol) throw new Error(msg || `Expected ~${b}, got ${a}`);
}

// ─── Helpers (use GameState from game.js) ─────────────────────────────
function resetGameState() {
  GameState.players = [];
  GameState.currentPlayerIdx = 0;
  GameState.globalRound = 1;
  GameState.mode = 'samy';
  GameState.roundScore = 0;
  GameState.lives = 3;
  GameState.roundTimer = 0;
  GameState._resetRequested = false;
}

function addPlayer(name, totalScore = 0, highScore = 0) {
  GameState.players.push({ name, totalScore, highScore: highScore || totalScore });
}

// Wait for real Phaser scene systems so rendering helpers can be tested.
window.addEventListener('DOMContentLoaded', () => {
  const started = performance.now();
  const waitForScene = () => {
    const scene = phaserGame?.scene.getScene('Menu');
    if (scene?.sys.displayList || performance.now() - started > 5000) {
      runTests();
    } else {
      requestAnimationFrame(waitForScene);
    }
  };
  waitForScene();
});

function runTests() {

// ═════════════════════════════════════════════════════════════════════
// TESTS
// ═════════════════════════════════════════════════════════════════════

section('shared.js — Phaser text rendering');
test('makeText creates sharp text with the bundled Phaser version', () => {
  const scene = phaserGame.scene.getScene('Menu');
  assert(scene?.sys.displayList, 'Menu scene did not initialize');
  const text = makeText(scene, 10.25, 20.75, 'Rendering regression');
  try {
    assert(text instanceof Phaser.GameObjects.Text);
    assertEqual(text.text, 'Rendering regression');
    assertEqual(text.x, 10);
    assertEqual(text.y, 21);
    assertEqual(text.style.resolution, Math.max(1, window.devicePixelRatio || 1));
  } finally {
    text.destroy();
  }
});

// ─── shared.js — rectsOverlap & col ───────────────────────────────────
section('shared.js — rectsOverlap');

test('overlapping rects return true', () => {
  assert(rectsOverlap(0, 0, 10, 10, 5, 5, 10, 10));
});
test('touching edges (not overlapping) return false', () => {
  assert(!rectsOverlap(0, 0, 10, 10, 10, 0, 10, 10));
});
test('separated rects return false', () => {
  assert(!rectsOverlap(0, 0, 5, 5, 20, 20, 5, 5));
});
test('one rect fully inside another', () => {
  assert(rectsOverlap(0, 0, 100, 100, 10, 10, 20, 20));
});

section('shared.js — col()');
test('col converts #ff0000 to 0xff0000', () => {
  assertEqual(col('#ff0000'), 0xff0000);
});
test('col converts #00ddff to int', () => {
  assertEqual(col('#00ddff'), 0x00ddff);
});


// ─── shared.js — constants (W, H from game.js) ────────────────────────
section('game.js — dimensions');
test('W and H constants defined', () => {
  assertEqual(typeof W, 'number');
  assertEqual(typeof H, 'number');
  assertEqual(W, 600);
  assertEqual(H, 500);
});


// ─── Audio ────────────────────────────────────────────────────────────
section('audio.js');

test('melody arrays have 16 entries each', () => {
  assertEqual(floMelody.length, 16);
  assertEqual(samyMelody.length, 16);
  assertEqual(janMelody.length, 16);
  assertEqual(felixMelody.length, 16);
});
test('baseLine has 8 entries', () => {
  assertEqual(baseLine.length, 8);
});
test('stopMusic is safe to call before user interaction', () => {
  stopMusic();
  assert(true);
});
test('startMusic is safe to call before initAudio', () => {
  startMusic('samy');
  stopMusic();
  assert(true);
});


// ─── GameState — endTurn / mode rotation ──────────────────────────────
section('game.js — GameState.endTurn');

test('mode rotates samy → flo', () => {
  resetGameState();
  addPlayer('Alice');
  GameState.mode = 'samy';
  GameState.endTurn();
  assertEqual(GameState.mode, 'flo');
});
test('mode rotates flo → jan', () => {
  resetGameState();
  addPlayer('Alice');
  GameState.mode = 'flo';
  GameState.endTurn();
  assertEqual(GameState.mode, 'jan');
});
test('mode rotates jan → felix', () => {
  resetGameState();
  addPlayer('Alice');
  GameState.mode = 'jan';
  GameState.endTurn();
  assertEqual(GameState.mode, 'felix');
});
test('mode rotates felix → samy', () => {
  resetGameState();
  addPlayer('Alice');
  GameState.mode = 'felix';
  GameState.endTurn();
  assertEqual(GameState.mode, 'samy');
});
test('score is added to player totalScore', () => {
  resetGameState();
  addPlayer('Alice');
  GameState.roundScore = 42;
  GameState.endTurn();
  assertEqual(GameState.players[0].totalScore, 42);
});
test('negative roundScore clamps to 0', () => {
  resetGameState();
  addPlayer('Alice');
  GameState.roundScore = -100;
  GameState.endTurn();
  assertEqual(GameState.players[0].totalScore, 0);
});
test('highScore is updated when totalScore exceeds it', () => {
  resetGameState();
  addPlayer('Alice', 0, 10);
  GameState.roundScore = 50;
  GameState.endTurn();
  assertEqual(GameState.players[0].highScore, 50);
});
test('highScore is NOT updated when totalScore is lower', () => {
  resetGameState();
  addPlayer('Alice', 0, 100);
  GameState.roundScore = 5;
  GameState.endTurn();
  assertEqual(GameState.players[0].highScore, 100);
});
test('currentPlayerIdx advances after turn', () => {
  resetGameState();
  addPlayer('Alice');
  addPlayer('Bob');
  GameState.endTurn();
  assertEqual(GameState.currentPlayerIdx, 1);
});
test('currentPlayerIdx wraps back to 0 after all players', () => {
  resetGameState();
  addPlayer('Alice');
  addPlayer('Bob');
  GameState.endTurn();
  GameState.endTurn();
  assertEqual(GameState.currentPlayerIdx, 0);
});
test('globalRound increments after full rotation of players', () => {
  resetGameState();
  addPlayer('Alice');
  addPlayer('Bob');
  assertEqual(GameState.globalRound, 1);
  GameState.endTurn();
  GameState.endTurn();
  assertEqual(GameState.globalRound, 2);
});


// ─── Storage / localStorage ───────────────────────────────────────────
section('storage.js — savePlayers / loadPlayers');

test('savePlayers writes to localStorage', () => {
  resetGameState();
  addPlayer('Alice', 10, 20);
  savePlayers();
  const raw = localStorage.getItem('spaceflow_players');
  assert(raw !== null);
  const data = JSON.parse(raw);
  assertEqual(data[0].name, 'Alice');
  assertEqual(data[0].highScore, 20);
});
test('loadPlayers restores names and highScores', () => {
  localStorage.setItem('spaceflow_players', JSON.stringify([
    { name: 'TestUser', highScore: 99 }
  ]));
  GameState.players = [];
  loadPlayers();
  assertEqual(GameState.players.length, 1);
  assertEqual(GameState.players[0].name, 'TestUser');
  assertEqual(GameState.players[0].highScore, 99);
  assertEqual(GameState.players[0].totalScore, 0);
});
test('loadPlayers ignores entries with empty name', () => {
  localStorage.setItem('spaceflow_players', JSON.stringify([
    { name: '', highScore: 5 },
    { name: 'Valid', highScore: 1 }
  ]));
  GameState.players = [];
  loadPlayers();
  assertEqual(GameState.players.length, 1);
  assertEqual(GameState.players[0].name, 'Valid');
});
test('loadPlayers caps at 8 players', () => {
  const data = Array.from({ length: 12 }, (_, i) => ({ name: `P${i}`, highScore: 0 }));
  localStorage.setItem('spaceflow_players', JSON.stringify(data));
  GameState.players = [];
  loadPlayers();
  assert(GameState.players.length <= 8, `Got ${GameState.players.length} players, expected ≤ 8`);
});
test('loadPlayers handles missing localStorage key', () => {
  localStorage.removeItem('spaceflow_players');
  GameState.players = [];
  loadPlayers();
  assert(true);
});
test('loadPlayers handles malformed JSON gracefully', () => {
  localStorage.setItem('spaceflow_players', '{{{broken');
  GameState.players = [{ name: 'Keep', highScore: 0 }];
  loadPlayers();
  assertEqual(GameState.players.length, 1);
  assertEqual(GameState.players[0].name, 'Keep');
});


// ─── Sidebar — sanitize ───────────────────────────────────────────────
section('sidebar.js — sanitize');

test('sanitize escapes HTML tags', () => {
  const out = sanitize('<img onerror="alert(1)">');
  assert(!out.includes('<img'), `Got: ${out}`);
});
test('sanitize escapes ampersand', () => {
  const out = sanitize('Tom & Jerry');
  assert(out.includes('&amp;'), `Expected &amp;, got: ${out}`);
});
test('sanitize returns plain text unchanged', () => {
  assertEqual(sanitize('Alice'), 'Alice');
});
test('sanitize handles empty string', () => {
  assertEqual(sanitize(''), '');
});


// ─── shared.js — mode metadata ────────────────────────────────────────
section('shared.js — mode metadata');

test('MODE_COLOR has all four modes', () => {
  assertEqual(Object.keys(MODE_COLOR).sort().join(','), 'felix,flo,jan,samy');
});
test('MODE_NAME matches MODE_SCENE', () => {
  assertEqual(MODE_NAME.samy, 'SAMY');
  assertEqual(MODE_SCENE.samy, 'Samy');
});
test('MODE_TIPS has tip for each mode', () => {
  ['flo', 'jan', 'felix', 'samy'].forEach(m => {
    assert(MODE_TIPS[m] && MODE_TIPS[m].length > 0, `Missing tip for ${m}`);
  });
});


// ─── shared.js — drawSpaceBg / STARS ───────────────────────────────────
section('shared.js — stars');

test('STARS array has entries with x, y, size, speed, alpha', () => {
  assert(STARS.length >= 1);
  const s = STARS[0];
  assert('x' in s && 'y' in s && 'size' in s && 'speed' in s && 'alpha' in s);
});


// ═════════════════════════════════════════════════════════════════════
// Render results
// ═════════════════════════════════════════════════════════════════════
const out = document.getElementById('output');
let currentSec = '', passed = 0, failed = 0;

for (const r of results) {
  if (r.section !== currentSec) {
    currentSec = r.section;
    const h = document.createElement('h2');
    h.textContent = currentSec;
    out.appendChild(h);
  }
  const div = document.createElement('div');
  div.className = r.ok ? 'pass' : 'fail';
  div.textContent = (r.ok ? '✓ ' : '✗ ') + r.name;
  if (!r.ok && r.error) {
    const pre = document.createElement('pre');
    pre.textContent = r.error;
    div.appendChild(pre);
  }
  out.appendChild(div);
  r.ok ? passed++ : failed++;
}

const summary = document.getElementById('summary');
summary.textContent = `${passed + failed} tests — ${passed} passed, ${failed} failed`;
summary.className   = failed === 0 ? 'all-pass' : 'has-fail';
}
</script>
</body>
</html>
